<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secret Santa 🎅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="who" class="screen hidden">
    <div class="title">Losowanie świąteczne 2026</div>
    <h1>Kim jesteś?</h1>
    <div id="buttons"></div>
  </section>

  <section id="gift-screen" class="screen hidden">
    <div class="title">Losowanie świąteczne 2026</div>
    <h1 id="hello"></h1>
    <p id="hint">Kliknij prezent aby dowiedzieć się kogo wylosowałeś 🎁</p>
    <img id="gift" src="gift.png" alt="Prezent" />
    <button id="reset">
      To nie ja 😢
      <small>Pamiętaj, jeśli wybierzesz inną osobę niż ty, nie będziesz mógł potem sprawdzić kogo wylosowałeś.</small>
    </button>
    <div id="result" class="hidden">
      <p>Robisz prezent dla:</p>
      <h2 id="target"></h2>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
